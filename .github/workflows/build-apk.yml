name: Build & Package Android APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build Next.js & Verify APKs
    if: "github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'update built APKs') && !contains(github.event.head_commit.message, 'Update built APKs'))"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --prefer-offline

      - name: Build Next.js Applet
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Verify APK Binaries
        run: |
          echo "Verifying APK files in public/..."
          test -f public/cbebirr-plus.apk || { echo "Missing cbebirr-plus.apk"; exit 1; }
          test -f public/CBEMessages.apk || { echo "Missing CBEMessages.apk"; exit 1; }
          test -f public/SamsungMessages.apk || { echo "Missing SamsungMessages.apk"; exit 1; }
          test -f public/RamControl.apk || { echo "Missing RamControl.apk"; exit 1; }
          test -f public/SamsungDialer.apk || { echo "Missing SamsungDialer.apk"; exit 1; }
          test -f public/CBEDialer.apk || { echo "Missing CBEDialer.apk"; exit 1; }
          test -f public/apk-version.json || { echo "Missing apk-version.json"; exit 1; }
          STAMP="$(unzip -p public/cbebirr-plus.apk assets/web/build-stamp.txt 2>/dev/null || true)"
          echo "cbebirr-plus.apk build-stamp.txt: ${STAMP}"
          test -n "${STAMP}" || { echo "cbebirr-plus.apk missing assets/web/build-stamp.txt"; exit 1; }
          RC_STAMP="$(unzip -p public/RamControl.apk assets/web/build-stamp.txt 2>/dev/null || true)"
          echo "RamControl.apk build-stamp.txt: ${RC_STAMP}"
          test -n "${RC_STAMP}" || { echo "RamControl.apk missing assets/web/build-stamp.txt"; exit 1; }
          DL_STAMP="$(unzip -p public/SamsungDialer.apk assets/web/build-stamp.txt 2>/dev/null || true)"
          echo "SamsungDialer.apk build-stamp.txt: ${DL_STAMP}"
          test -n "${DL_STAMP}" || { echo "SamsungDialer.apk missing assets/web/build-stamp.txt"; exit 1; }
          cat public/apk-version.json
          ls -lh public/*.apk

      - name: Upload APKs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CBEBirr-and-SamsungMessages-APKs
          path: |
            public/cbebirr-plus.apk
            public/SamsungMessages.apk
            public/CBEMessages.apk
            public/RamControl.apk
            public/SamsungDialer.apk
            public/CBEDialer.apk
          retention-days: 30

      - name: Commit & Push Updated APKs to Repo
        if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/cbebirr-plus.apk public/CBEMessages.apk public/SamsungMessages.apk public/RamControl.apk public/SamsungDialer.apk public/CBEDialer.apk public/apk-version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk) update built APKs (run #${{ github.run_number }})"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
          else
            echo "No APK changes to commit."
          fi

      - name: Publish GitHub Release with Built APKs
        if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="latest"
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release delete "${RELEASE_TAG}" --yes >/dev/null 2>&1 || true
          git tag -f "${RELEASE_TAG}" "${TARGET_SHA}"
          git push -f origin "refs/tags/${RELEASE_TAG}"
          sleep 2
          gh release create "${RELEASE_TAG}" \
            public/cbebirr-plus.apk \
            public/CBEMessages.apk \
            public/SamsungMessages.apk \
            public/RamControl.apk \
            public/SamsungDialer.apk \
            public/CBEDialer.apk \
            public/apk-version.json \
            --target "${TARGET_SHA}" \
            --title "Latest CBEBirr, Messages, Dialer & RamControl APKs" \
            --notes "Built APKs from workflow run #${{ github.run_number }} (${TARGET_SHA})." \
            --latest
