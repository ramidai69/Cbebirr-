plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cbe.cbebirrdialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.cbe.cbebirrdialer"
        minSdk 24
        targetSdk 34
        def ciRunNumber = (System.getenv("GITHUB_RUN_NUMBER")?.isInteger()) ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 5
        versionCode (ciRunNumber + 1000)
        versionName "1.0.${ciRunNumber + 90}"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    aaptOptions {
        noCompress "mp3", "wav", "ogg", "m4a", "webm"
    }
}

dependencies {
}
